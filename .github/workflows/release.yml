name: Release

# Publishes prebuilt server binaries. Push a tag to cut a release:
#
#   git tag -a v0.2.0 -m "coherent schematics" && git push origin v0.2.0
#
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # A tag must not ship what main could not build, and a cross-compiled
  # binary cannot be tested on the runner, so the gate runs separately.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go build ./...
      - run: go test -timeout 300s ./...

  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
      VERSION: ${{ github.ref_name }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        run: |
          stem="qucs-mcp-$VERSION-$GOOS-$GOARCH"
          bin=qucs-mcp
          ext=tar.gz
          if [ "$GOOS" = windows ]; then
            bin=qucs-mcp.exe
            ext=zip
          fi
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/dedomorozoff/qucs-mcp/internal/config.version=$VERSION \
              -X github.com/dedomorozoff/qucs-mcp/internal/config.commit=$COMMIT" \
            -o "stage/$stem/$bin" ./cmd/qucs-mcp
          cp README.md "stage/$stem/README.md"
          mkdir -p dist
          if [ "$ext" = zip ]; then
            (cd stage && zip -qrg "../dist/$stem.zip" "$stem")
          else
            tar -czf "dist/$stem.tar.gz" -C stage "$stem"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # gh resolves the repository and the note's compare base from git, so
      # publishing has to run inside a checkout; without it gh fails with
      # "not a git repository" before it reaches the API. Full history is
      # needed as well: the notes walk the log back to the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum -- qucs-mcp-* > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # --generate-notes only lists merged pull requests, and this
          # repository is pushed to directly, so it wrote nothing but a
          # changelog link. Compose the body from the commit log instead.
          prev=$(git tag --sort=-creatordate --merged "$(git rev-list -n1 "$VERSION")" \
            | grep -v "^$VERSION$" | head -1 || true)
          if [ -n "$prev" ]; then range="$prev..$VERSION"; else range="$VERSION"; fi
          {
            echo "MCP server that turns SPICE text into Qucs-S schematics and runs"
            echo "them through ngspice. It drives the local \`qucs-s\` binary, so Qucs-S"
            echo "has to be installed separately; set \`QUCS_S_ROOT\` unless \`qucs-s\` is"
            echo "already on \`PATH\`. Unpack the archive for your platform and point the"
            echo "MCP client at the binary inside; \`SHA256SUMS\` covers every file here."
            echo
            echo "\`qucs-mcp --version\` reports this tag and the commit it was built from."
            echo
            echo "## Changes"
            echo
            git log --no-merges --pretty='- %s' "$range"
          } > NOTES.md
          cat NOTES.md

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          # gh ships with the runner image, so publishing needs no
          # third-party action. Re-running a tag repairs that release in
          # place instead of failing on an existing one; the target moves
          # with it, so the notes and the assets describe the same commit.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --target "$COMMIT" --notes-file NOTES.md
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" --notes-file NOTES.md dist/*
          fi
