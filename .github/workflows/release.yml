name: Release

# Publishes prebuilt server binaries. Push a tag to cut a release:
#
#   git tag -a v0.2.0 -m "coherent schematics" && git push origin v0.2.0
#
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # A tag must not ship what main could not build, and a cross-compiled
  # binary cannot be tested on the runner, so the gate runs separately.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go build ./...
      - run: go test -timeout 300s ./...

  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
      VERSION: ${{ github.ref_name }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        run: |
          stem="qucs-mcp-$VERSION-$GOOS-$GOARCH"
          bin=qucs-mcp
          ext=tar.gz
          if [ "$GOOS" = windows ]; then
            bin=qucs-mcp.exe
            ext=zip
          fi
          go build -trimpath \
            -ldflags "-s -w \
              -X github.com/dedomorozoff/qucs-mcp/internal/config.version=$VERSION \
              -X github.com/dedomorozoff/qucs-mcp/internal/config.commit=$COMMIT" \
            -o "stage/$stem/$bin" ./cmd/qucs-mcp
          cp README.md "stage/$stem/README.md"
          mkdir -p dist
          if [ "$ext" = zip ]; then
            (cd stage && zip -qrg "../dist/$stem.zip" "$stem")
          else
            tar -czf "dist/$stem.tar.gz" -C stage "$stem"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # gh resolves the repository and the note's compare base from git, so
      # publishing has to run inside a checkout; without it gh fails with
      # "not a git repository" before it reaches the API.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum -- qucs-mcp-* > SHA256SUMS
          cat SHA256SUMS

      # gh ships with the runner image, so publishing needs no third-party
      # action; --generate-notes writes the body from the PRs merged since
      # the previous tag.
      - name: Publish
        run: gh release create "$VERSION" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
